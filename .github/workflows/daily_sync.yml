name: Daily Raises Auto Sync

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）定时自动执行
    - cron: '0 2 * * *'
  workflow_dispatch: # 允许在 GitHub Actions 页面手动点击 "Run workflow" 立即触发

permissions:
  contents: write # 显式赋予提交和写入代码的权限

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run sync script
        run: python sync_raises.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add raises.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update raises.json [skip ci]" && git push)

      - name: Trigger Cloudflare Worker Sync
        run: |
          # 自动触发你的 vc-sync Worker 进行入库
          curl -s -L "https://vc-sync.swhx7758521.workers.dev/?s=arc-master-dispatch-secret-2026-xYz9AbCd"
